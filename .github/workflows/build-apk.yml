
name: Build GAME BOOSTER MOBILE LEGEND V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Project Files
        run: |
          echo "Checking project structure..."
          ls -la
          echo "Checking app folder..."
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle tidak ditemukan!"
            exit 1
          fi

      - name: Fix App Module Settings
        run: |
          if ! grep -q 'include.*app' settings.gradle; then
            echo 'include(":app")' >> settings.gradle
          fi

      - name: Give Gradle Permission
        run: chmod +x gradlew

      - name: Check Gradle Tasks
        run: ./gradlew tasks --all

      - name: Build Android APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GAME-BOOSTER-MOBILE-LEGEND-V3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
